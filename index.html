<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce JS Vanilla</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Fake Shop</a>

        <button
          id="cartButton"
          class="btn btn-outline-primary position-relative"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#cartSidebar"
          aria-controls="cartSidebar"
          aria-label="Abrir carrito"
        >
          🛒
          <span
            id="cartBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
          >
            0
          </span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <section class="mb-4" aria-labelledby="search-title">
      <h1 id="search-title" class="visually-hidden">Listado de productos</h1>

      <div class="row justify-content-center">
        <div class="col-12 col-md-8">
          <input
            id="searchInput"
            class="form-control"
            type="search"
            placeholder="Buscar productos..."
            aria-label="Buscar productos"
          />
        </div>
      </div>
    </section>

    <section class="mb-4" aria-labelledby="categories-title">
      <h2 id="categories-title" class="h4 mb-3">Categorías</h2>
      <div id="categoriesContainer" class="d-flex flex-wrap gap-2"></div>
    </section>

    <section aria-labelledby="products-title">
      <h2 id="products-title" class="visually-hidden">Productos</h2>
      <div id="productsContainer" class="row g-4"></div>
    </section>
  </main>

  <div
    class="modal fade"
    id="productModal"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div id="productModalContent" class="modal-content"></div>
    </div>
  </div>
  <div
    class="modal fade"
    id="confirmClearCartModal"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5">Vaciar carrito</h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Cerrar"
          ></button>
        </div>

        <div class="modal-body">
          <p class="mb-0">
            ¿Estás seguro de que querés eliminar todos los productos del carrito?
          </p>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancelar
          </button>

          <button
            id="confirmClearCartButton"
            type="button"
            class="btn btn-danger"
          >
            Eliminar productos
          </button>
        </div>
      </div>
    </div>
  </div>
  <aside
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="cartSidebar"
    aria-labelledby="cartSidebarLabel"
  >
    <div class="offcanvas-header">
      <h2 id="cartSidebarLabel" class="offcanvas-title h5">Carrito</h2>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="offcanvas"
        aria-label="Cerrar carrito"
      ></button>
    </div>

    <div class="offcanvas-body">
      <div id="cartItemsContainer"></div>

      <div class="border-top pt-3 mt-3">
        <p class="fw-bold fs-5">
          Total: $<span id="cartTotal">0</span>
        </p>

        <button id="checkoutButton" class="btn btn-primary w-100 mb-2">
          Finalizar compra
        </button>

        <button id="clearCartButton" class="btn btn-danger w-100">
          Eliminar todos los productos
        </button>
      </div>
    </div>
  </aside>

  <footer class="border-top py-3 mt-5">
    <div class="container text-center text-muted small">
      Laboratorio de Aplicaciones Web Cliente - E-commerce JS Vanilla
    </div>
  </footer>

  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div
      id="appToast"
      class="toast align-items-center text-bg-success border-0"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="d-flex">
        <div id="appToastMessage" class="toast-body">
          Operación realizada correctamente.
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          data-bs-dismiss="toast"
          aria-label="Cerrar"
        ></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
